[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unischeduler-importer"
version = "0.1.0"
description = "Loss-preserving XLSX timetable parser and transactional UNIScheduler importer"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
unischeduler = "unischeduler_importer.cli:main"

[tool.setuptools.packages.find]
include = ["unischeduler_importer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
